openapi: 3.1.0
info:
  title: ED Employee Directory Read API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /departments:
    get:
      summary: List departments
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"
  /employees:
    get:
      summary: List employees
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
        - name: departmentId
          in: query
          schema:
            type: string
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Employee page
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Employee"
                  nextCursor:
                    type: [string, "null"]
  /employees/{employeeNumber}:
    get:
      summary: Get one employee by Employee Number
      parameters:
        - name: employeeNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Employee"
        "404":
          description: Employee not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Department:
      type: object
      required: [id, name, normalizedName, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        normalizedName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmployeeStatus:
      type: string
      enum: [ATTIVO, CESSATO, DA_ASSUMERE]
    Language:
      type: string
      enum: [IT, EN]
      description: Interface language the Ferie portal shows this employee.
    Employee:
      type: object
      required:
        - id
        - employeeNumber
        - firstName
        - lastName
        - workEmail
        - preferredLanguage
        - departmentId
        - birthDate
        - hireDate
        - terminationDate
        - retirementDate
        - retirementDateOverridden
        - fte
        - usaCategory
        - contractType
        - tfr
        - status
        - canBeSubstituteResponsible
        - weeklySchedule
        - approvalRoles
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        employeeNumber:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        workEmail:
          type: string
          format: email
          description: HR-entered official work address. Unique across employees and never derived from names.
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        departmentId:
          type: string
        department:
          $ref: "#/components/schemas/Department"
        birthDate:
          type: string
          format: date
        hireDate:
          type: [string, "null"]
          format: date
        terminationDate:
          type: [string, "null"]
          format: date
        retirementDate:
          type: string
          format: date
        retirementDateOverridden:
          type: boolean
          description: True when the retirement date is confirmed and excluded from pension-age recalculation.
        fte:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        usaCategory:
          type: string
          enum: [EXEMPT, NON_EXEMPT, OTHER]
        contractType:
          type: string
          enum: [INDETERMINATO, DETERMINATO, CONTRATTO_USA, COLLABORATORE]
        tfr:
          type: string
          enum: [I_TATTI, FONDO_PENSIONE]
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        canBeSubstituteResponsible:
          type: boolean
          description: True when the employee can be selected as Sostituto-Responsabile.
        weeklySchedule:
          $ref: "#/components/schemas/WeeklySchedule"
        approvalRoles:
          $ref: "#/components/schemas/EmployeeApprovalRoles"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WeeklyScheduleDay:
      type: object
      required: [minutes, display]
      properties:
        minutes:
          type: integer
          minimum: 0
          maximum: 1440
        display:
          type: string
          description: Italian sessantesimi display string, for example 7,30.
    WeeklySchedule:
      type: object
      required: [monday, tuesday, wednesday, thursday, friday, total]
      properties:
        monday:
          $ref: "#/components/schemas/WeeklyScheduleDay"
        tuesday:
          $ref: "#/components/schemas/WeeklyScheduleDay"
        wednesday:
          $ref: "#/components/schemas/WeeklyScheduleDay"
        thursday:
          $ref: "#/components/schemas/WeeklyScheduleDay"
        friday:
          $ref: "#/components/schemas/WeeklyScheduleDay"
        total:
          type: object
          required: [minutes, display]
          properties:
            minutes:
              type: integer
              minimum: 0
            display:
              type: string
    EmployeeApprovalReference:
      type: object
      required: [id, employeeNumber, firstName, lastName, status, department]
      properties:
        id:
          type: string
        employeeNumber:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        department:
          $ref: "#/components/schemas/Department"
    EmployeeApprovalRoles:
      type: object
      required: [preApprovers, responsabili, substituteResponsabili]
      properties:
        preApprovers:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeApprovalReference"
        responsabili:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeApprovalReference"
        substituteResponsabili:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeApprovalReference"
