openapi: 3.1.0
info:
  title: ED Time-Off Directory Contract
  version: 1.0.0
  description: >
    The minimal employee projection the Ferie portal syncs from, plus the single
    field it may write back. ED is authoritative for every value here.

    Consumer contract of record:
    ferie/docs/employee-directory-openapi.yaml. This document describes what ED
    actually serves; keep the two in step when either side changes.

    Trust boundary: the preferred-language endpoint is called with a
    machine-to-machine token, which carries no end-user identity. The portal
    asserts which employee a change is for, and ED cannot verify that the change
    originated with that employee.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /time-off-directory/employees:
    get:
      summary: Paginated employee projection for the Ferie portal
      description: >
        Requires the read scope (AUTH0_READ_SCOPE) or the staff role. Responds with
        `items`, not `data`, because the shape is fixed by the consumer contract.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Id of the last item on the previous page.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Employee projection page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimeOffEmployee"
                  nextCursor:
                    type: [string, "null"]
        "400":
          description: Invalid cursor or limit
        "403":
          description: Missing read scope
  /time-off-directory/employees/{id}/preferred-language:
    patch:
      summary: Record an employee's preferred interface language
      description: >
        The only field an external client may write. Guarded by its own scope
        (AUTH0_WRITE_SCOPE, default `write:time-off-directory`) rather than the
        read scope, so read-only sync credentials cannot mutate anything. Any
        property other than preferredLanguage is rejected. Recorded in the audit
        log with the calling client as the actor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preferredLanguage]
              properties:
                preferredLanguage:
                  $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: The stored preference
          content:
            application/json:
              schema:
                type: object
                required: [preferredLanguage]
                properties:
                  preferredLanguage:
                    $ref: "#/components/schemas/Language"
        "400":
          description: Unknown language, or an attempt to write another field
        "403":
          description: Missing write scope
        "404":
          description: No such employee
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Language:
      type: string
      enum: [IT, EN]
    WorkInterval:
      type: object
      additionalProperties: false
      required: [weekday, start, end]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = Monday. ED contracts only Monday-Friday, so 6 and 7 are never emitted.
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    TimeOffEmployee:
      type: object
      additionalProperties: false
      required:
        - id
        - employeeNumber
        - auth0Subject
        - workEmail
        - displayName
        - title
        - department
        - status
        - fte
        - schedule
        - roles
        - preferredLanguage
        - approvers
        - updatedAt
      properties:
        id:
          type: string
        employeeNumber:
          type: string
          description: The Employee Number as a string, per the consumer contract.
        auth0Subject:
          type: string
          description: >
            Synthetic and stable: `auth0|ed-<employeeNumber>`. ED does not model Auth0
            identities yet, and Ferie keys its mirror rows on this value, so it must
            never change between syncs. Replace with the real tenant subject once ED
            stores Auth0 identities.
        workEmail:
          type: string
          format: email
        displayName:
          type: string
          description: "`firstName lastName`."
        title:
          type: [string, "null"]
          description: Always null; ED has no job-title field.
        department:
          type: object
          required: [id, name, updatedAt]
          properties:
            id:
              type: string
            name:
              type: string
            updatedAt:
              type: string
              format: date-time
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          description: ATTIVO maps to ACTIVE; CESSATO and DA_ASSUMERE both map to INACTIVE.
        fte:
          type: number
          exclusiveMinimum: 0
        schedule:
          type: array
          description: >
            Clock intervals derived from the stored per-day minutes, anchored at 09:00.
            A day over 240 minutes is split by a 30-minute break, with the odd minute
            given to the morning; days with no contracted time are omitted. The
            intervals always re-add to that day's contracted minutes, because Ferie
            deducts hourly permesso from them.
          items:
            $ref: "#/components/schemas/WorkInterval"
        roles:
          type: array
          description: >
            Application roles from the TIME_OFF_DIRECTORY_ROLES configuration. ED holds
            no application-role master data, so this is empty unless configured.
          items:
            type: string
            enum: [FERIE_FINAL_APPROVER, FERIE_PORTAL_ADMIN, STAFF_IT]
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        approvers:
          type: array
          description: ED's per-role approver assignments flattened into one list.
          items:
            type: object
            required: [employeeSourceId, role]
            properties:
              employeeSourceId:
                type: string
                description: The approver's ED employee id.
              role:
                type: string
                enum: [PRE_APPROVER, RESPONSABILE, SUBSTITUTE_RESPONSABILE]
        updatedAt:
          type: string
          format: date-time
