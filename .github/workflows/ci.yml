name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real Postgres so the server integration suite actually runs instead of
    # self-skipping (the tests skip cleanly when the DB is unreachable).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ed
          POSTGRES_PASSWORD: ed
          POSTGRES_DB: ed_employee_directory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ed -d ed_employee_directory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ed:ed@localhost:5432/ed_employee_directory_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to the test database
        run: pnpm --filter @itatti/server db:deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm build
