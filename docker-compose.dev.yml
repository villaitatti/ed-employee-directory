services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ed_employee_directory
      POSTGRES_USER: ed
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55433:5432"
    volumes:
      - ed_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ed -d ed_employee_directory"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ed_dev_pgdata:
